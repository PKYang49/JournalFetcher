<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期刊週報 2026-W19</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --accent: #0b5fff;
    --tag-bg: #eef3ff;
    --tag-text: #0b5fff;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
      "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px 16px 64px;
    line-height: 1.65;
  }
  .container { max-width: 760px; margin: 0 auto; }
  header { margin-bottom: 32px; }
  h1 { margin: 0 0 8px; font-size: 28px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 14px; }
  .nav { margin-top: 12px; }
  .nav a { color: var(--accent); text-decoration: none; font-size: 14px; }
  .nav a:hover { text-decoration: underline; }
  .summary-bar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 24px;
    font-size: 14px;
    color: var(--muted);
  }
  .summary-bar strong { color: var(--text); }
  article {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--tag-text);
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 6px;
    margin-bottom: 8px;
  }
  .pub-type {
    background: #f0f0f0;
    color: #555;
  }
  .pub-type.type-trial      { background: #e6f7ec; color: #1d7a44; }
  .pub-type.type-evidence   { background: #f3eaff; color: #6d28d9; }
  .pub-type.type-guideline  { background: #ffe8d6; color: #b85c00; }
  .pub-type.type-review     { background: #e7f0ff; color: #0b5fff; }
  .pub-type.type-editorial  { background: #fff4e6; color: #b85c00; }
  .pub-type.type-original   { background: #fff8e1; color: #8a6d00; }
  .pub-type.type-other      { background: #f0f0f0; color: #666; }
  @media (prefers-color-scheme: dark) {
    .pub-type.type-trial      { background: #1f3a2c; color: #7fd0a3; }
    .pub-type.type-evidence   { background: #3a2f4a; color: #c9a8ff; }
    .pub-type.type-guideline  { background: #4a3320; color: #ffb878; }
    .pub-type.type-review     { background: #1f3050; color: #9ec0ff; }
    .pub-type.type-editorial  { background: #4a3320; color: #ffb878; }
    .pub-type.type-original   { background: #3d3520; color: #e8c878; }
    .pub-type.type-other      { background: #333; color: #aaa; }
  }
  h2 {
    font-size: 17px;
    font-weight: 600;
    margin: 4px 0 8px;
    line-height: 1.4;
  }
  .authors { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .summary-block { margin: 12px 0; }
  .section-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0;
    margin-bottom: 3px;
  }
  .summary { font-size: 15px; margin: 0; }
  .summary.error { color: #b00; font-style: italic; }
  .commentary {
    border-left: 3px solid var(--accent);
    color: var(--text);
    font-size: 15px;
    margin-top: 12px;
    padding-left: 12px;
  }
  .commentary p { margin: 0; }
  .links { font-size: 13px; margin-top: 10px; }
  .links a { color: var(--accent); text-decoration: none; margin-right: 14px; }
  .links a:hover { text-decoration: underline; }
  .copy-btn {
    appearance: none;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    cursor: pointer;
    font: inherit;
    font-size: 13px;
    margin: 4px 8px 0 0;
    padding: 3px 8px;
  }
  .copy-btn:hover { border-color: var(--accent); }
  .copy-btn.copied {
    background: var(--tag-bg);
    border-color: var(--accent);
  }
  footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --text: #e8e8e8;
      --muted: #999;
      --border: #333;
      --accent: #6ea8ff;
      --tag-bg: #2a3a5a;
      --tag-text: #a8c4ff;
    }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📚 期刊週報 2026-W19</h1>
    <div class="meta">2026-05-08 16:18 UTC+08:00 · 共 1 篇</div>
    <div class="nav"><a href="index.html">← 回到週報索引</a></div>
  </header>

  <div class="summary-bar">
    
      <strong>NEJM</strong> 1
    
  </div>

  
  <article>
    <span class="tag">NEJM</span>
    <span class="tag pub-type type-review">Review</span>
    <h2>Cerebral Amyloid Angiopathy.</h2>
    <div class="authors">
      Greenberg Steven M · 2026
    </div>
    <div class="summary-block">
      <div class="section-label">摘要</div>
      <p class="summary error">
        [--no-summarize 模式：未生成摘要]
      </p>
    </div>
    
    <div class="links">
      <a href="https://doi.org/10.1056/NEJMra2411298" target="_blank" rel="noopener">DOI</a>
      <a href="https://pubmed.ncbi.nlm.nih.gov/42090794/" target="_blank" rel="noopener">PubMed</a>
      
      <button class="copy-btn" type="button" data-copy="10.1056/NEJMra2411298">複製 DOI</button>
      <button class="copy-btn" type="button" data-copy="python dlbydoi.py 10.1056/NEJMra2411298">複製下載指令</button>
      
    </div>
  </article>
  

  <footer>
    Generated by JournalFetcher · 2026-05-08 16:18 UTC+08:00
  </footer>
</div>
<script>
  document.querySelectorAll(".copy-btn").forEach((button) => {
    button.addEventListener("click", async () => {
      const text = button.dataset.copy || "";
      try {
        await navigator.clipboard.writeText(text);
        const originalText = button.textContent;
        button.textContent = "已複製";
        button.classList.add("copied");
        window.setTimeout(() => {
          button.textContent = originalText;
          button.classList.remove("copied");
        }, 1200);
      } catch {
        window.prompt("請手動複製", text);
      }
    });
  });
</script>
</body>
</html>
