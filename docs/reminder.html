<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Reminder</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e5e5e5;
    --accent: #0b5fff;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
      "Microsoft JhengHei", sans-serif;
    line-height: 1.6;
  }
  main {
    width: min(560px, calc(100vw - 32px));
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }
  h1 {
    margin: 0 0 12px;
    font-size: 22px;
  }
  p {
    margin: 0 0 16px;
    color: var(--muted);
  }
  a {
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
  }
  a:hover { text-decoration: underline; }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --text: #e8e8e8;
      --muted: #aaaaaa;
      --border: #333333;
      --accent: #6ea8ff;
    }
  }
</style>
</head>
<body>
<main>
  <h1>新增提醒事項</h1>
  <p id="status">正在開啟 iOS 捷徑...</p>
  <p><a id="fallback" href="#">如果沒有自動開啟，請點這裡</a></p>
</main>
<script>
  const params = new URLSearchParams(window.location.search);
  const text = params.get("text") || "";
  const shortcutName = params.get("shortcut") || "Add Reminder from Discord";
  const shortcutUrl = new URL("shortcuts://run-shortcut");

  shortcutUrl.searchParams.set("name", shortcutName);
  shortcutUrl.searchParams.set("input", "text");
  shortcutUrl.searchParams.set("text", text);

  const fallback = document.getElementById("fallback");
  fallback.href = shortcutUrl.toString();

  if (!text) {
    document.getElementById("status").textContent = "沒有收到提醒事項內容。";
  } else {
    window.location.href = shortcutUrl.toString();
  }
</script>
</body>
</html>
